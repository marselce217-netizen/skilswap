<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap — Cek Koneksi</title>
  <style>
    body {
      margin: 0; min-height: 100vh; padding: 20px;
      background: #0b0d10; color: #f5f7fa;
      font-family: Arial, sans-serif; box-sizing: border-box;
    }
    h1 { font-size: 18px; margin-bottom: 4px; }
    p.hint { color: #9299a5; font-size: 13px; margin-bottom: 20px; }
    .row {
      background: #12151a; border: 1px solid #252a32;
      border-radius: 10px; padding: 14px; margin-bottom: 10px; font-size: 14px;
    }
    .ok { color: #55c98a; }
    .fail { color: #e87575; }
    button {
      padding: 12px 16px; border: none; border-radius: 8px;
      background: #e8eee9; color: #101514; font-weight: bold;
      margin-right: 8px; margin-top: 8px;
    }
    pre {
      background: #0b0d10; border: 1px solid #252a32; border-radius: 8px;
      padding: 10px; font-size: 12px; overflow-x: auto;
      white-space: pre-wrap; word-break: break-word;
    }
  </style>
</head>
<body>

  <h1>SkillSwap — Cek Koneksi Supabase</h1>
  <p class="hint">Halaman ini cuma buat diagnosa. Tidak ada redirect, tidak dipanggil otomatis oleh index.html.</p>

  <div class="row" id="cdnStatus">1. Cek CDN Supabase: memeriksa...</div>
  <div class="row" id="clientStatus">2. Cek koneksi client: menunggu...</div>
  <div class="row" id="sessionStatus">3. Cek status login: menunggu...</div>

  <button onclick="runCheck()">Jalankan Cek Ulang</button>
  <button onclick="showRawSession()">Lihat Detail Session</button>

  <pre id="rawOutput"></pre>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    function setRow(id, message, ok) {
      const el = document.getElementById(id);
      el.textContent = message;
      el.className = "row " + (ok ? "ok" : "fail");
    }

    async function runCheck() {
      if (typeof supabase === "undefined") {
        setRow("cdnStatus", "1. CDN Supabase: GAGAL DIMUAT (cek koneksi internet / CDN diblokir)", false);
        setRow("clientStatus", "2. Cek koneksi client: dilewati (CDN gagal)", false);
        setRow("sessionStatus", "3. Cek status login: dilewati (CDN gagal)", false);
        return;
      }
      setRow("cdnStatus", "1. CDN Supabase: berhasil dimuat", true);

      if (typeof sb === "undefined") {
        setRow("clientStatus", "2. Koneksi client: GAGAL (file supabase-client.js tidak ditemukan atau error)", false);
        setRow("sessionStatus", "3. Cek status login: dilewati (client gagal)", false);
        return;
      }
      setRow("clientStatus", "2. Koneksi client: berhasil dibuat (URL & key terbaca)", true);

      try {
        const { data, error } = await sb.auth.getSession();
        if (error) {
          setRow("sessionStatus", "3. Cek status login: ERROR — " + error.message, false);
          return;
        }
        if (data.session) {
          setRow("sessionStatus", "3. Status login: SEDANG LOGIN sebagai " + data.session.user.email, true);
        } else {
          setRow("sessionStatus", "3. Status login: belum login (ini normal kalau kamu belum login)", true);
        }
      } catch (err) {
        setRow("sessionStatus", "3. Cek status login: ERROR TAK TERDUGA — " + err.message, false);
      }
    }

    async function showRawSession() {
      const { data } = await sb.auth.getSession();
      document.getElementById("rawOutput").textContent = JSON.stringify(data, null, 2);
    }

    runCheck();
  </script>
</body>
</html>
