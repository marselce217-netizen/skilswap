    <script>

        /* =========================
           AUTH GUARD
        ========================== */

        let currentUser = null;

        (async function checkAuth() {

            const { data: { session } } = await sb.auth.getSession();

            if (!session) {
                window.location.href = "login.html";
                return;
            }

            currentUser = session.user;

            document.getElementById("authLoading").style.display = "none";

        })();


        function logout() {

            sb.auth.signOut().then(function() {
                window.location.href = "login.html";
            });

        }
function editProfile() {
    document.getElementById("profileModal").classList.add("show");
}
}

        let selectedUser = "";

        /* =========================
           PAGE NAVIGATION
        ========================== */

        function showPage(pageId, button) {

            const pages =
                document.querySelectorAll(".page");

            pages.forEach(page => {
                page.classList.remove("active");
            });

            document
                .getElementById(pageId)
                .classList.add("active");


            const buttons =
                document.querySelectorAll(".nav-btn");

            buttons.forEach(btn => {
                btn.classList.remove("active");
            });

            button.classList.add("active");

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }


        /* =========================
           SEARCH
        ========================== */

        function searchUsers() {

            const query =
                document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();

            const cards =
                document.querySelectorAll(".user-card");

            cards.forEach(card => {

                const data =
                    card.dataset.search;

                if (data.includes(query)) {

                    card.style.display = "";

                } else {

                    card.style.display = "none";

                }

            });

        }


        /* =========================
           SWAP
        ========================== */

        function requestSwap(user) {

            selectedUser = user;

            document
                .getElementById("modalTitle")
                .textContent =
                "Kirim Skill Swap";

            document
                .getElementById("modalText")
                .textContent =
                "Kamu ingin mengirim permintaan Skill Swap kepada " +
                user +
                ". Pada versi berikutnya, permintaan ini akan tersimpan di database.";

            document
                .getElementById("modal")
                .classList.add("show");
        }


        function confirmAction() {

            alert(
                "Permintaan Skill Swap untuk " +
                selectedUser +
                " berhasil dibuat (demo)."
            );

            closeModal();
        }


        /* =========================
           SKIP
        ========================== */

        function skipUser(user) {

            alert(
                user +
                " dilewati. Sistem akan menampilkan rekomendasi berikutnya."
            );

        }


        /* =========================
           CHAT
        ========================== */

        function openChat(user) {

            alert(
                "Chat dengan " +
                user +
                " akan tersedia setelah sistem chat dan database dibuat."
            );

        }


        /* =========================
           MODAL
        ========================== */

        function closeModal() {

            document
                .getElementById("modal")
                .classList.remove("show");

        }


        document
            .getElementById("modal")
            .addEventListener("click", function(event) {

                if (event.target === this) {
                    closeModal();
                }

            });

    </script>
